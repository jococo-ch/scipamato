<!DOCTYPE html>
<html xmlns:wicket="https://wicket.apache.org">
<head>
    <wicket:head>
        <title>Newsletter Topic Sort Order</title>
    </wicket:head>
</head>
<body>
    <wicket:extend>
        <div class="container-fluid">
            <h2 wicket:id="header"></h2>
            <form wicket:id="form" class="border">
                <input type="hidden" wicket:id="order"/>
                <ul wicket:id="sortable" class="topic-sortable list-group">
                    <li wicket:id="items" class="list-group-item">
                        <i wicket:id="icon"></i>
                        <span wicket:id="item" class="item">[label]</span>
                    </li>
                </ul>
                <br/>
                <div>
                    <a wicket:id="submit">Submit</a>
                    <a wicket:id="cancel">Cancel</a>
                </div>
            </form>
        </div>
    </wicket:extend>
</body>
</html>
